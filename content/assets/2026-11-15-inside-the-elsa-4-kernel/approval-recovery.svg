<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" viewBox="0 0 760 568" role="img" aria-labelledby="title desc">
  <title id="title">How an early invoice approval survives a crash</title>
  <desc id="desc">The publisher stores the approval before a wait exists. Node A then commits the wait and a message to check earlier events together. A crashes. After takeover, node B reads the check message, matches the retained approval, then applies it and schedules a notification to Accounting.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #223c3c; }
      .lane { font-size: 19px; font-weight: 650; }
      .label { font-size: 18px; }
      .small { font-size: 16px; }
      .lifeline { stroke: #a3b7b0; stroke-width: 1.5; stroke-dasharray: 4 5; }
      .send { fill: none; stroke: #234d50; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="760" height="568" rx="14" fill="#fbf8f0"/>
  <text x="26" y="39" font-size="25" font-weight="680">When the approval arrives before the wait</text>

  <g text-anchor="middle">
    <rect x="20" y="65" width="178" height="43" rx="7" fill="#e8eff1"/>
    <text x="109" y="93" class="lane">Event publisher</text>
    <rect x="273" y="65" width="180" height="43" rx="7" fill="#deebe4"/>
    <text x="363" y="93" class="lane">Durable store</text>
    <rect x="538" y="65" width="202" height="43" rx="7" fill="#e8eff1"/>
    <text x="639" y="93" class="lane">Workflow owner</text>
  </g>

  <path class="lifeline" d="M109 109 V193 M363 109 V543 M639 109 V276 M639 336 V543"/>
  <g text-anchor="middle" class="label">
    <text x="235" y="143">Retain the approval</text>
    <path class="send" d="M109 157 H360 M352 152 L360 157 L352 162"/>
    <text x="235" y="184" class="small">No matching wait yet</text>

    <text x="501" y="211">Node A saves the wait</text>
    <text x="501" y="234">and a “check earlier events”</text>
    <text x="501" y="257">message in one commit</text>
    <path class="send" d="M639 270 H366 M374 265 L366 270 L374 275"/>
  </g>

  <rect x="21" y="286" width="718" height="46" rx="6" fill="#f6e7d7"/>
  <path d="M38 301 l13 15 m0 -15 l-13 15" fill="none" stroke="#97511e" stroke-width="2.6"/>
  <text x="64" y="315" font-size="18" font-weight="600">Node A crashes. Node B takes over the partition.</text>

  <g text-anchor="middle" class="label">
    <text x="501" y="367">B reads the pending check</text>
    <path class="send" d="M363 381 H636 M628 376 L636 381 L628 386"/>
    <text x="501" y="417">B finds the retained approval</text>
    <text x="501" y="440">and enqueues its delivery</text>
    <path class="send" d="M639 453 H366 M374 448 L366 453 L374 458"/>
    <text x="501" y="490">Next turn records approval</text>
    <text x="501" y="513">and queues the Accounting job</text>
    <path class="send" d="M639 526 H366 M374 521 L366 526 L374 531"/>
  </g>
</svg>
